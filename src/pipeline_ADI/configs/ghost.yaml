experiment:
  name: pipeline_ADI_merged_grid

algorithms:
  CADI: true
  PCAD: true

datasets:
  int:
    enabled: true
    science_file: /home/aosimul/noah/data/ghost_images/10_20ws/int_0.5ro_10ws.npy
    psf_file: /home/aosimul/noah/data/ghost_images/10_20ws/psf_int_0.5ro_10ws.npy
  pred:
    enabled: true
    science_file: /home/aosimul/noah/data/ghost_images/10_20ws/pred_0.5ro_10ws.npy
    psf_file: /home/aosimul/noah/data/ghost_images/10_20ws/psf_pred_0.5ro_10ws.npy

instrument:
  dit_science: 0.015
  # dit_factor: 25
  dit_psf: 0.5
  # radius_psf: 10
  # radius_sc: 50


fake_planet:
  flux_ratio_mag: [3, 4, 5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 12.5, 13, 13.5, 14, 15]
  num_fake_planets: 6 #6
  components: [5, 10, 20, 50, 75, 100, 150, 200] #[10, 50, 100, 150]

  separation: 1
  max_separation: 1

  approx_svd_trunc: 3125
  device: "cuda"
  pca_method: "gram" 
  niter: 1 

  angle_start: 0
  angle_end: 30

contrast:

  enabled: true         # if not enabled, only the fake planet experiment is performed
  path: "results/contrast"            # Root directory for output curves.
                                      # OPTIONAL, Default: results/contrast


  save_best: true                     # Save contrast curves overall best as CSV files.
                                      # OPTIONAL, Default: false
